<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1.0" >
    <meta http-equiv="X-UA-Compatible" content="ie=edge" >
    <link rel="stylesheet" href="css/style.css" >
    <!-- <link rel="stylesheet" href="css/_style.css" > -->
    <title>Steve Smith</title>
  </head>
  <body>
    <main class="main">
      <h1>Rolodex Card Demo</h1>
      <div class="rolodex-card">
        <div class="profile identity">
          <img
            src="img/headshot.jpg"
            alt="Picture of Paolo Maldini"
            class="headshot"
            width="250"
            height="250"
            >
          <h2>Paolo Maldini</h2>
          <h3>Front End Developer</h3>
        </div>
        <div class="profile details">
          <p><span class="field">Company</span>Web Weavers</p>
          <p><span class="field">Experience</span>3 Years</p>
          <p><span class="field">School</span>University of Washington</p>
          <p><span class="field">Major</span>Marketing</p>
          <p><span class="field">Email</span>paolo@example.com</p>
          <div class="social-link">
            <img
              src="img/linkedin.svg"
              alt="Logo of LinkedIn" >
            <a href="steve.linkedinprofile.com">paolo.linkedinprofile.com</a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
